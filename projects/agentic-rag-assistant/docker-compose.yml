# Local one-command run:  docker compose up --build
# Requires a .env file (cp .env.example .env, then set ANTHROPIC_API_KEY).
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist the local vector index across container restarts.
      - ./.chroma:/app/.chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
